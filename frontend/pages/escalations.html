            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="avatar">--</div>
                    <div class="sidebar-user-info">
                        <span class="sidebar-user-name">Loading...</span>
                        <span class="sidebar-user-role">User</span>
                        <button class="logout-btn" title="Logout"
                            style="background:none;border:none;color:rgba(255,255,255,0.5);cursor:pointer;padding:8px;margin-left:auto;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"

                    </div>
                </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Header -->
            <header class="top-header">
                <div class="header-left">
                    <button class="mobile-menu-toggle btn-icon btn-ghost">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <line x1="3" y1="12" x2="21" y2="12" />
                            <line x1="3" y1="6" x2="21" y2="6" />
                            <line x1="3" y1="18" x2="21" y2="18" />
                        </svg>
                    </button>
                    <h1 class="header-title">Escalations</h1>
                </div>

                <div class="header-right">
                    <div class="escalation-stats">
                        <span class="escalation-stat">
                            <span class="escalation-stat-value">3</span>
                            <span class="escalation-stat-label">Pending</span>
                        </span>
                        <span class="escalation-stat">
                            <span class="escalation-stat-value">12</span>
                            <span class="escalation-stat-label">Today</span>
                        </span>
                    </div>
                </div>
            </header>

            <!-- Page Content -->
            <div class="page-content">
                <div class="page-header">
                    <h2 class="page-title">Escalation Queue</h2>
                    <p class="page-subtitle">Conversations requiring human intervention.</p>
                </div>

                <!-- Escalation Filters -->
                <div class="escalation-filters glass-card">
                    <div class="filter-group">
                        <button class="filter-btn active" data-filter="all">All (15)</button>
                        <button class="filter-btn filter-btn--urgent" data-filter="urgent">Urgent (3)</button>
                        <button class="filter-btn" data-filter="high">High (5)</button>
                        <button class="filter-btn" data-filter="medium">Medium (7)</button>
                    </div>
                    <div class="filter-actions">
                        <select class="form-select">
                            <option>Sort by: Newest</option>
                            <option>Sort by: Priority</option>
                            <option>Sort by: Wait Time</option>
                        </select>
                    </div>
                </div>

                <!-- Escalation Cards -->
                <div class="escalation-grid">
                    <!-- Dynamic content loaded by escalations.js -->
                </div>
            </div>
        </main>
    </div>

    <!-- Sidebar Overlay (Mobile) -->
    <div class="sidebar-overlay"></div>

    <!-- Scripts -->

    <script src="../js/sidebar.js"></script>
