# ═══════════════════════════════════════════════════════════════════
# Behavioral Agentic AI — Docker Compose (Coolify / Production)
# Run: docker-compose up -d
# ═══════════════════════════════════════════════════════════════════

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: behavioral-ai-backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      # ── Database ────────────────
      - DATABASE_URL=sqlite:///./data/app.db
      # ── LLM — OpenRouter + Claude Sonnet 3.5 ────────────────
      - LLM_API_KEY=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
      - LLM_BASE_URL=https://openrouter.ai/api/v1
      - LLM_MODEL=anthropic/claude-3.5-sonnet
      - LLM_FALLBACK_MODEL=anthropic/claude-3-haiku
      - OPENROUTER_API_KEY=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
      # ── Vector Store ────────────
      - VECTOR_STORE_DIR=/app/data/vector_store
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      # ── Security ────────────────
      - JWT_SECRET_KEY=bhai-production-jwt-secret-change-me-to-random-64-chars
      # ── Application ─────────────
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DEBUG=false
      - CORS_ORIGINS=*
    volumes:
      - backend-data:/app/data
      - backend-logs:/app/logs
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/" ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  backend-data:
    driver: local
  backend-logs:
    driver: local
